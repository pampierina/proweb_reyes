<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porygon Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f0f8ff;
            color: #333;
        }
        #pokemon-info {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: inline-block;
        }
        img {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff4500;
        }
        h2 {
            color: #4682b4;
        }
        p {
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <h1>Información de Porygon</h1>
    <div id="pokemon-info">
        <img id="sprite" src="" alt="Sprite de Porygon">
        <h2 id="nombre"></h2>
        <p><strong>Número de Pokédex:</strong> <span id="numero"></span></p>
        <p><strong>Tipo:</strong> <span id="tipo"></span></p>
    </div>

    <p>¿Prefieres los gatos?</p>
    <div>
        <button onclick="handleClick()">Mira un nuevo gato</button>
    </div>
    <img id="cat-img" src="" alt="Imagen de gato">
    
    <!-- Llamada al archivo API.js -->
    <script src="./API.js"></script>
</body>
</html>
